name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # En main no se cancela para no cortar una publicacion a la mitad
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Probar (pruebas + JaCoCo)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Incluye las pruebas con Kafka y Redis en Docker (Testcontainers) y falla si la cobertura baja de 80%
      - name: Pruebas + cobertura
        run: mvn -B -ntp verify

      - name: Subir reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn

  analysis:
    name: Analisis (SonarQube Cloud)
    permissions:
      contents: read
      pull-requests: read
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      RUN_SONAR: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar necesita el historial para el blame / codigo nuevo

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Descargar reporte de cobertura
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Resumen de cobertura
        run: |
          csv=target/site/jacoco/jacoco.csv
          [ -f "$csv" ] || { echo "::warning::No se encontro $csv"; exit 0; }
          awk -F, 'NR>1 { m+=$8; c+=$9 } END { printf "### Cobertura JaCoCo (lineas): %.1f%% (%d de %d)\n", (m+c>0 ? 100*c/(m+c) : 0), c, m+c }' "$csv" >> "$GITHUB_STEP_SUMMARY"

      - name: Analizar con SonarQube Cloud
        if: env.RUN_SONAR == 'true'
        run: >
          mvn -B -ntp -DskipTests -Djacoco.skip=true test-compile
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.qualitygate.wait=true

      - name: Sonar omitido
        if: env.RUN_SONAR != 'true'
        run: echo "::notice::Sonar omitido (falta el secret SONAR_TOKEN)."

  build:
    name: Construir imagen Docker
    permissions:
      contents: read
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Construir imagen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          tags: c15-social:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publica la imagen en GHCR (la usaran Azure Container Apps y el compose del gateway)
  publish:
    name: Publicar imagen
    needs: [analysis, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nombre de la imagen
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login a GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha

