spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://escaperoomc15.us.auth0.com/
          audiences: https://api.escaperoomc15
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

c15:
  estado:
    margen: 10m
  eventos:
    # Sin Kafka: las pruebas publican los eventos directo (ApplicationEventPublisher); *KafkaTest lo enciende
    kafka: false
  servicios:
    salas: http://salas.invalid
  stomp:
    broker:
      relay: false

management:
  otlp:
    tracing:
      export:
        enabled: false
    logging:
      export:
        enabled: false
